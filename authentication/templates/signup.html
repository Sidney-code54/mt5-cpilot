<!DOCTYPE html>
<html>
<head>
    <title>Sign Up | MT5 Copilot</title>
</head>
<body>
    <h2>Sign Up</h2>
    <form method="POST">
        {{ form.hidden_tag() }}
        <p>
            {{ form.email.label }}<br>
            {{ form.email(size=32) }}
        </p>
        <p>
            {{ form.password.label }}<br>
            {{ form.password(size=32) }}
        </p>
        <p>{{ form.submit() }}</p>
    </form>
    <p>Already have an account? <a href="/login">Log in</a></p>
</body>
</html>
