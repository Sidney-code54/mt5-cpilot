<h1>Welcome, {{ user.email }}</h1>
<p><a href="{{ url_for('auth.ask_mode') }}">🔍 Go to Ask Mode</a></p>
<p><a href="{{ url_for('auth.logout') }}">Logout</a></p>

<hr>

<h3>Your Strategy History</h3>
<ul>
  {% for strat in strategies %}
    <li>
      <strong>{{ strat.symbol }}</strong> – {{ strat.created_at.strftime('%Y-%m-%d %H:%M') }}<br>
      <pre>{{ strat.plan_text }}</pre>
    </li>
  {% else %}
    <p>No strategies yet.</p>
  {% endfor %}
</ul>
